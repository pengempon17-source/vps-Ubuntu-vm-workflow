name: GitHub Actions Terminal VPS

on:
  workflow_dispatch:

jobs:
  terminal-vps:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3
      with:
        ref: V7

    - name: Install Essential Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bison flex libncurses5-dev libssl-dev libelf-dev bc clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu zip tmate

    - name: Start SSH Terminal Session
      uses: mxschmitt/action-tmate@v3
