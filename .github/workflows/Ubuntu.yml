name: vps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: Login Tailscale
        run: sudo tailscale up --auth-key ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Set Root Password
        run: |
          echo "root:root" | sudo chpasswd
          echo "Root password successfully set!"

       - name: Configure Root SSH
        run: |
          sudo sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/g' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/g' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          
      - name: Hold Runner Alive
        run: |
          echo "Tailscale connected! Holding runner for the maximum allowed time (6 hours)..."
          sleep 2160000
          
